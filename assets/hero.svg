<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">TangCyrus — personal lab</title><desc id="desc">Building useful things, one idea at a time. Web development, AI tools and everyday systems. Purple and cyan orbital artwork with a TC monogram.</desc>

<style>
