<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">TangCyrus — personal lab</title><desc id="desc">Mobile banner: Web development, AI tools and everyday systems.</desc>

<style>
@keyframes enter { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } }
.intro { animation:enter 1.2s ease-out both }
.static-copy { display:none }
@media (prefers-reduced-motion: reduce) { .intro { animation:none } .motion { display:none } .static-copy { display:inline } }
</style><defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111528"/><stop offset="1" stop-color="#080d19"/></linearGradient>
 <linearGradient id="titleFill" x2="1" y2=".4"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e7deff"/><stop offset="1" stop-color="#bcb2ff"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#9a7bff"/><stop offset="1" stop-color="#64ebdf"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#7950e8" stop-opacity=".23"/><stop offset="1" stop-color="#7950e8" stop-opacity="0"/></radialGradient>
 <radialGradient id="sphere" cx=".3" cy=".2" r=".85"><stop stop-color="#48517b"/><stop offset=".42" stop-color="#232948"/><stop offset="1" stop-color="#0d1224"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a89bff" stroke-opacity=".045"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="1" y="1" width="718" height="558" rx="22" fill="url(#bg)" stroke="#2a3048"/>
<rect x="2" y="2" width="716" height="556" rx="21" fill="url(#grid)"/>
<ellipse cx="574" cy="401" rx="230" ry="210" fill="url(#nebula)"/>
<g class="intro" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
 <text x="42" y="71" fill="#b6a6fa" font-size="19" letter-spacing="3">THE PERSONAL LAB OF</text>
 <text x="36" y="181" fill="url(#titleFill)" font-size="90" font-weight="750" letter-spacing="-4">TangCyrus<tspan fill="#68e4d7">.</tspan></text>
 <text x="42" y="244" fill="#d1d7e9" font-size="30" font-weight="500">Building useful things,</text>
 <text x="42" y="287" fill="#d1d7e9" font-size="30" font-weight="500">one idea at a time.</text>
 <text x="42" y="352" fill="#8f9ab5" font-size="25">Web development</text>
 <text x="42" y="390" fill="#8f9ab5" font-size="25">AI tools</text>
 <text x="42" y="428" fill="#8f9ab5" font-size="25">Everyday systems</text>
 <path d="M42 480H122" stroke="url(#accent)" stroke-width="3"/>
 <text x="42" y="521" fill="#a6b1c9" font-size="19" letter-spacing="2">EXPLORE. BUILD. REFINE.</text>
</g>
<g transform="translate(563 387) scale(.62)">
<g class="motion">
