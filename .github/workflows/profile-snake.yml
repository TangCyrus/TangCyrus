name: Update contribution snake

on:
  schedule:
    - cron: '27 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-snake.yml']

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Generate animation from actual contribution data
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=#b59aff&color_dots=#161b22,#26364b,#376e7d,#56a9ac,#79e5d5
            dist/contributions-light.svg?palette=github-light&color_snake=#8357d5&color_dots=#ebedf0,#d4cff1,#aba0df,#8372c7,#6750b5
      - name: Publish generated SVG files
        run: |
          mkdir -p assets
          cp dist/contributions-dark.svg dist/contributions-light.svg assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions-dark.svg assets/contributions-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update contribution snake [skip ci]"
          git push origin HEAD:main
